name: Deploy to Hostinger

on:
  push:
    branches:
      - claude/android-ios-app-functional-q69j7k
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Install sshpass
        run: sudo apt-get update -y && sudo apt-get install -y sshpass

      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SSHPASS: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          sshpass -e ssh -p "$DEPLOY_PORT" \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "$DEPLOY_USER@$DEPLOY_HOST" '
            [ -f ~/.bashrc ] && source ~/.bashrc
            [ -f ~/.bash_profile ] && source ~/.bash_profile
            set -euo pipefail

            export SETUP_TOKEN=${{ secrets.SETUP_TOKEN }}

            APP_DIR="$HOME/domains/hardwarecenters.com/app"
            BRANCH="claude/android-ios-app-functional-q69j7k"
            REPO_URL="https://github.com/OadDev/Hardware-centre-app-CL.git"

            if [ -d "$APP_DIR/.git" ]; then
              cd "$APP_DIR"
              git fetch origin "$BRANCH"
              git reset --hard "origin/$BRANCH"
            elif [ -d "$APP_DIR" ]; then
              # $APP_DIR exists but isn'\''t a git checkout (e.g. its .git got
              # lost some other way) — clone would refuse to touch a non-empty
              # directory, so adopt it as a git checkout in place instead.
              # Point HEAD at the branch and reset --hard rather than
              # `checkout -B`, since checkout refuses to clobber untracked
              # files (e.g. storage/**/.gitignore) that already exist on
              # disk, while reset --hard overwrites them without complaint.
              cd "$APP_DIR"
              git init
              git remote add origin "$REPO_URL" 2>/dev/null || git remote set-url origin "$REPO_URL"
              git fetch origin "$BRANCH"
              git symbolic-ref HEAD "refs/heads/$BRANCH"
              git reset --hard "origin/$BRANCH"
            else
              git clone --branch "$BRANCH" --single-branch "$REPO_URL" "$APP_DIR"
            fi

            bash "$APP_DIR/scripts/deploy.sh"
          '

      - name: Ensure DB_HOST uses TCP, APP_NAME matches the current brand name
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SSHPASS: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          sshpass -e ssh -p "$DEPLOY_PORT" \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "$DEPLOY_USER@$DEPLOY_HOST" '
            [ -f ~/.bashrc ] && source ~/.bashrc
            [ -f ~/.bash_profile ] && source ~/.bash_profile
            set -euo pipefail

            BACKEND_DIR="$HOME/domains/hardwarecenters.com/app/backend"
            ENV_FILE="$BACKEND_DIR/.env"

            # deploy.sh copies public/ into public_html but never deletes
            # orphaned files there, so this temporary diagnostic script (now
            # removed from the repo) needs an explicit removal here.
            rm -f "$HOME/domains/hardwarecenters.com/public_html/_diag.php"

            CHANGED=0

            if grep -q "^DB_HOST=localhost$" "$ENV_FILE"; then
              sed -i "s/^DB_HOST=localhost$/DB_HOST=127.0.0.1/" "$ENV_FILE"
              CHANGED=1
            fi

            # .env was created once from .env.example at install time and is
            # never touched by later deploys, so the brand-name fix in
            # .env.example does not reach an already-installed server on its
            # own — patch the live value directly instead.
            if grep -q "^APP_NAME=\"Hardware Centre" "$ENV_FILE"; then
              sed -i "s/^APP_NAME=\"Hardware Centre/APP_NAME=\"Hardware Centers/" "$ENV_FILE"
              CHANGED=1
            fi

            if [ "$CHANGED" = "1" ]; then
              PHP_BIN=""
              for v in 85 84 83 82; do
                candidate="/opt/alt/php${v}/usr/bin/php"
                if [ -x "$candidate" ]; then PHP_BIN="$candidate"; break; fi
              done

              cd "$BACKEND_DIR"
              "$PHP_BIN" artisan config:clear
              "$PHP_BIN" artisan config:cache
            fi
          '
