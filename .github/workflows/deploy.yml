name: Deploy to Hostinger

on:
  push:
    branches:
      - claude/android-ios-app-functional-q69j7k
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Install sshpass
        run: sudo apt-get update -y && sudo apt-get install -y sshpass

      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SSHPASS: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          sshpass -e ssh -p "$DEPLOY_PORT" \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "$DEPLOY_USER@$DEPLOY_HOST" '
            [ -f ~/.bashrc ] && source ~/.bashrc
            [ -f ~/.bash_profile ] && source ~/.bash_profile
            set -euo pipefail

            export SETUP_TOKEN=${{ secrets.SETUP_TOKEN }}

            APP_DIR="$HOME/domains/hardwarecenters.com/app"
            BRANCH="claude/android-ios-app-functional-q69j7k"
            REPO_URL="https://github.com/OadDev/Hardware-centre-app-CL.git"

            if [ -d "$APP_DIR/.git" ]; then
              cd "$APP_DIR"
              git fetch origin "$BRANCH"
              git reset --hard "origin/$BRANCH"
            elif [ -d "$APP_DIR" ]; then
              # $APP_DIR exists but isn'\''t a git checkout (e.g. its .git got
              # lost some other way) — clone would refuse to touch a non-empty
              # directory, so adopt it as a git checkout in place instead.
              # Point HEAD at the branch and reset --hard rather than
              # `checkout -B`, since checkout refuses to clobber untracked
              # files (e.g. storage/**/.gitignore) that already exist on
              # disk, while reset --hard overwrites them without complaint.
              cd "$APP_DIR"
              git init
              git remote add origin "$REPO_URL" 2>/dev/null || git remote set-url origin "$REPO_URL"
              git fetch origin "$BRANCH"
              git symbolic-ref HEAD "refs/heads/$BRANCH"
              git reset --hard "origin/$BRANCH"
            else
              git clone --branch "$BRANCH" --single-branch "$REPO_URL" "$APP_DIR"
            fi

            bash "$APP_DIR/scripts/deploy.sh"
          '

      - name: Diagnose MySQL socket connectivity
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SSHPASS: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          sshpass -e ssh -p "$DEPLOY_PORT" \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "$DEPLOY_USER@$DEPLOY_HOST" '
            [ -f ~/.bashrc ] && source ~/.bashrc
            [ -f ~/.bash_profile ] && source ~/.bash_profile
            ENV_FILE="$HOME/domains/hardwarecenters.com/app/backend/.env"
            echo "--- .env DB_* (password masked) ---"
            grep -E "^DB_" "$ENV_FILE" | sed -E "s/^(DB_PASSWORD=).*/\1***MASKED***/"
            echo "--- pdo_mysql.default_socket / mysqli.default_socket (CLI php85 ini) ---"
            /opt/alt/php85/usr/bin/php -i 2>/dev/null | grep -i "default_socket"
            echo "--- common mysql socket file locations ---"
            ls -la /var/lib/mysql/mysql.sock /var/run/mysqld/mysqld.sock /tmp/mysql.sock 2>/dev/null || true
            echo "--- can php85 CLI actually connect via TCP 127.0.0.1:3306? ---"
            /opt/alt/php85/usr/bin/php -r "
              \$host = getenv(\"DB_HOST\") ?: \"127.0.0.1\";
              try {
                \$pdo = new PDO(\"mysql:host=127.0.0.1;port=3306\", \"root\", \"\", [PDO::ATTR_TIMEOUT => 3]);
                echo \"TCP 127.0.0.1:3306 reachable (auth aside)\" . PHP_EOL;
              } catch (\Throwable \$e) {
                echo \"TCP attempt result: \" . \$e->getMessage() . PHP_EOL;
              }
            "
            echo "--- FPM pool / ini files for this domain (best-effort search) ---"
            find /etc /opt/alt -iname "*hardwarecenters*" 2>/dev/null | head -20 || true
          '
